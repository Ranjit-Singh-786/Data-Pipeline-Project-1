services:
  mysql:
    image: mysql:8.0
    container_name: insurance-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root@123
      MYSQL_DATABASE: insurance
      MYSQL_USER: insurance_user
      MYSQL_PASSWORD: insurance_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
